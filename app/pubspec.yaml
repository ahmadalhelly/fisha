name: mttl_hub
description: Fisha - control LG U+ MTTL-W01 smart power strips through an ESP32 hub (local + cloud). By ahmadalhelly.
publish_to: 'none'
version: 2.0.17+30

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  intl: any
  mqtt_client: ^10.5.1
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  file_picker: ^10.1.0
  path_provider: ^2.1.4
  open_filex: ^4.6.0
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  local_auth: ^2.3.0
  google_sign_in: ^6.2.2
  # local bridge (packages/home_widget): the pub.dev home_widget pulled in WorkManager and crashed the app at start
  home_widget:
    path: packages/home_widget

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon_fg.png
  fonts:
    - family: PhosphorLight
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Light.ttf
    - family: PhosphorDuotone
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Duotone.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "#070D19"
  adaptive_icon_foreground: "assets/brand/icon_fg.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#070D19"
  image: assets/brand/splash.png
  branding: assets/brand/branding.png
  branding_mode: bottom
  android: true
  ios: false
  web: false
  android_12:
    color: "#070D19"
    image: assets/brand/splash.png
    branding: assets/brand/branding.png
