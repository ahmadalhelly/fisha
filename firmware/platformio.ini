; Hub firmware build with a custom ESP32 Arduino core config (hub 2.15.38): same Arduino core 3.3.12 as before,
; rebuilt with more network sockets (10+ strips) and a smaller TLS send buffer (frees ~12 KB of RAM).
; Build: pio run -d firmware   ->  firmware/.pio/build/hub/firmware.bin
[platformio]
src_dir = mttl_hub
default_envs = hub

[env:hub]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags = -DWEBSERVER_MAX_HEADER_WAIT=1500 -DFISHA_REQUIRE_10=1
custom_sdkconfig =
  CONFIG_LWIP_MAX_SOCKETS=26
  CONFIG_LWIP_MAX_ACTIVE_TCP=26
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
  CONFIG_LWIP_TCP_OVERSIZE_QUARTER_MSS=y
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_PEER_CERT=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
