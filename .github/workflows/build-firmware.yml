name: Build Hub firmware

on:
  push:
    branches:
      - '**'
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-fw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      APP_TOKEN: ${{ secrets.FISHA_APP_TOKEN || secrets.FISHA_WEB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read firmware version
        id: ver
        run: |
          v=$(grep -m1 'FW_VERSION = "' firmware/mttl_hub/mttl_hub.ino | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$v" ] || { echo "FW_VERSION not found"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # v2.15.39: the only hub build is the 10-strip one. Arduino core 3.3.12 with the ESP32 libraries rebuilt by pioarduino
      # (firmware/platformio.ini: 26 sockets, 4 KB TLS send buffer); #error if those settings were not applied
      # (FISHA_REQUIRE_10). The old arduino-cli 6-strip build was dropped (saves CI minutes).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      # the ESP32 libraries pioarduino rebuilds for our settings land in firmware/.pio (~13 min to build from scratch)
      - uses: actions/cache@v4
        with:
          path: firmware/.pio
          key: pio-build-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}-${{ github.run_number }}
          restore-keys: pio-build-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}-

      - name: Compile (10 strips, Minimal SPIFFS with OTA)
        run: |
          set -o pipefail
          v=${{ steps.ver.outputs.v }}
          pip install -q platformio esptool
          pio run -d firmware 2>&1 | tee build10.log
          B=firmware/.pio/build/hub
          cp $B/firmware.bin fisha-hub-$v.bin
          # full flash image (bootloader + partitions + boot_app0 + app) for an erased/new hub: flash at 0x0
          FW=$(find ~/.platformio/packages -maxdepth 1 -name 'framework-arduinoespressif32' | head -1)
          python -m esptool --chip esp32 merge-bin -o fisha-hub-$v-FULL-flash-0x0.bin \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $FW/tools/partitions/boot_app0.bin 0x10000 $B/firmware.bin 2>&1 | tee -a build10.log
          {
            echo "== sizes"; ls -l fisha-hub-*.bin; sha256sum fisha-hub-*.bin
            echo "== RAM"; ~/.platformio/packages/toolchain-xtensa-esp-elf/bin/xtensa-esp32-elf-size -A $B/firmware.elf | grep -E "dram0|iram0"
          } 2>&1 | tee -a build10.log

      - uses: actions/upload-artifact@v4
        with:
          name: fisha-hub-${{ steps.ver.outputs.v }}
          path: fisha-hub-${{ steps.ver.outputs.v }}.bin
          if-no-files-found: error

      # workflow artifact only, never in the release: turns /api/heapdiag addresses into code lines. The cleanup job
      # below deletes the artifacts of earlier runs, so it lasts until the next build of this workflow (or 14 days)
      - uses: actions/upload-artifact@v4
        with:
          name: fisha-hub-elf-${{ steps.ver.outputs.v }}
          path: firmware/.pio/build/hub/firmware.elf
          retention-days: 14
          if-no-files-found: warn

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hub-fw-${{ steps.ver.outputs.v }}-run-${{ github.run_number }}
          name: Fisha Hub firmware ${{ steps.ver.outputs.v }} (run ${{ github.run_number }})
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            fisha-hub-${{ steps.ver.outputs.v }}.bin
            fisha-hub-${{ steps.ver.outputs.v }}-FULL-flash-0x0.bin
          body: |
            Hub firmware ${{ steps.ver.outputs.v }} for ESP32 Dev Module (Minimal SPIFFS, OTA).
            Upload fisha-hub-${{ steps.ver.outputs.v }}.bin from the app (Settings → Hub firmware) or the hub's /update page.
            New or erased hub: flash fisha-hub-${{ steps.ver.outputs.v }}-FULL-flash-0x0.bin at 0x0 (esptool write_flash 0x0 ...).

      # Arabic notes for the app's update center: firmware commits since the last good build of this branch
      - name: Write release notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow build-firmware.yml --branch "${{ github.ref_name }}" --status success --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)
          if [ -n "$prev" ] && git cat-file -e "$prev" 2>/dev/null && [ "$prev" != "$GITHUB_SHA" ]; then range="$prev..$GITHUB_SHA"; else range="-1 $GITHUB_SHA"; fi
          git log --no-merges --reverse --format='### %s%n%n%b' $range -- firmware \
            | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):' | cat -s > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "Hub firmware ${{ steps.ver.outputs.v }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
          # public repo (fisha-app): general categories only, never details (owner rule 2026-10-15). Each commit may carry
          # a trailer like "Public: إصلاح أخطاء"; details stay in the private release above.
          git log --no-merges --format='%(trailers:key=Public,valueonly)' $range -- firmware | sed 's/^ *//; s/ *$//' | grep -v '^$' | awk '!seen[$0]++' | sed 's/^/- /' > PUBLIC_NOTES.md
          [ -s PUBLIC_NOTES.md ] || echo "- إصلاح أخطاء وتحسينات" > PUBLIC_NOTES.md
          cat PUBLIC_NOTES.md

      # one draft per version on fisha-app: older unpublished drafts of the same version are removed first (a published
      # release is never touched). The tag keeps its run/build number: the app's update center reads that format.
      - name: Remove older drafts of this version on fisha-app
        if: success() && env.APP_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.APP_TOKEN }}
        run: |
          gh api --paginate "repos/ahmadalhelly/fisha-app/releases?per_page=100" \
            --jq '.[] | select(.draft == true and (.tag_name | startswith("hub-${{ steps.ver.outputs.v }}-run-"))) | .id' |
          while read -r id; do gh api -X DELETE "repos/ahmadalhelly/fisha-app/releases/$id" && echo "removed draft $id"; done

      # the public repo fisha-app is where the app's update center looks (this repo is private). Published as a draft:
      # the update center sees it only after the owner presses Publish on github.com/ahmadalhelly/fisha-app/releases.
      # Needs the secret FISHA_APP_TOKEN: a token with Contents read/write on ahmadalhelly/fisha-app.
      - name: Publish to fisha-app (update center)
        if: success() && env.APP_TOKEN != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: ahmadalhelly/fisha-app
          draft: true                 # reaches users only after the owner presses Publish on GitHub
          token: ${{ env.APP_TOKEN }}
          tag_name: hub-${{ steps.ver.outputs.v }}-run-${{ github.run_number }}
          name: Hub ${{ steps.ver.outputs.v }}
          make_latest: false
          files: fisha-hub-${{ steps.ver.outputs.v }}.bin
          body_path: PUBLIC_NOTES.md

      # Strip firmware (F1.0.82) for the hub's "fetch latest" button: the public draft release strip-F1.0.82 on
      # fisha-app. The hub downloads from that link once the owner presses Publish, same as the hub and app builds.
      - name: Publish strip firmware to fisha-app (draft)
        if: success() && env.APP_TOKEN != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: ahmadalhelly/fisha-app
          draft: true
          token: ${{ env.APP_TOKEN }}
          tag_name: strip-F1.0.82
          name: Strip firmware F1.0.82
          make_latest: false
          files: firmware/strip-fw/comMTTL-W01_F1.0.82.fwr
          body: |
            - تحديث فيرموير المشترك

      - name: Delete earlier runs, artifacts and caches of this workflow
        continue-on-error: true
        run: |
          runs=$(gh run list --workflow "$WF" --limit 200 --json databaseId,status,conclusion,headBranch \
            -q '.[] | "\(.databaseId) \(.status) \(.conclusion) \(.headBranch)"')
          keep=$(echo "$runs" | awk '$3=="success" && !seen[$4]++ {print $1}')
          echo "$runs" | while read -r id status concl branch; do
            [ -n "$id" ] || continue
            [ "$id" -lt "$CUR" ] || continue            # this run and newer ones stay
            [ "$status" = "completed" ] || continue
            for a in $(gh api --paginate "repos/$REPO/actions/runs/$id/artifacts" --jq '.artifacts[].id' 2>/dev/null); do
              gh api -X DELETE "repos/$REPO/actions/artifacts/$a" >/dev/null && echo "artifact $a of run $id removed"
            done
            if echo "$keep" | grep -qx "$id"; then continue; fi
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null && echo "run $id removed"
          done
          # caches: per key family only the newest one is kept (the build of this run has saved its caches already, so
          # it is the newest); the older ones go. A family is the key without its last part (the run number or hash).
          gh cache list --limit 100 --json id,key,createdAt \
            -q 'sort_by(.createdAt) | reverse | group_by(.key | sub("-[^-]*$"; "")) | .[] | .[1:][] | "\(.id) \(.key)"' |
          while read -r cid key; do
            gh cache delete "$cid" >/dev/null 2>&1 && echo "cache $key removed"
          done
