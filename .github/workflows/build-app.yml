name: Build Android APK

on:
  push:
    branches:
      - '**'
    paths:                       # only app changes build the APK (saves CI minutes); run by hand otherwise
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      APP_TOKEN: ${{ secrets.FISHA_APP_TOKEN || secrets.FISHA_WEB_TOKEN }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version
        id: ver
        run: |
          f=pubspec.yaml; [ -f app/pubspec.yaml ] && f=app/pubspec.yaml
          v=$(grep -m1 '^version:' "$f" | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          [ -n "$v" ] || { echo "version not found"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze, test, build
        run: |
          set -o pipefail
          {
            flutter --version
            flutter create --platforms=android --org com.mttlhub --project-name mttl_hub .
            pip install --quiet --break-system-packages pillow || pip install --quiet pillow
            python3 tool/configure_android.py
            flutter pub get
            dart run flutter_launcher_icons
            dart run flutter_native_splash:create
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release --target-platform android-arm64 --build-name=${{ steps.ver.outputs.v }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ steps.ver.outputs.v }}
            cp build/app/outputs/flutter-apk/app-release.apk ../Fisha-${{ steps.ver.outputs.v }}-${{ github.run_number }}.apk
          } 2>&1 | tee ../build.log

      - name: Upload APK as Artifact
        if: success()
        continue-on-error: true      # the release below carries the APK too; a full artifact quota must not block it
        uses: actions/upload-artifact@v4
        with:
          name: Fisha-${{ steps.ver.outputs.v }}-build-${{ github.run_number }}
          path: Fisha-${{ steps.ver.outputs.v }}-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Write release notes (changes since the last good build of this branch)
        if: success()
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow build-app.yml --branch "${{ github.ref_name }}" --status success --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)
          f=CHANGES-${{ steps.ver.outputs.v }}-build-${{ github.run_number }}.md
          {
            echo "# Fisha ${{ steps.ver.outputs.v }} (build ${{ github.run_number }})"
            echo
            echo "Branch: \`${{ github.ref_name }}\` · Commit: \`${GITHUB_SHA::7}\`"
            echo
            echo "## What changed"
            echo
            if [ -n "$prev" ] && git cat-file -e "$prev" 2>/dev/null && [ "$prev" != "$GITHUB_SHA" ]; then
              range="$prev..$GITHUB_SHA"
            else
              range="-1 $GITHUB_SHA"
            fi
            git log --no-merges --reverse --format='### %s%n%n%b' $range \
              | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):' \
              | cat -s
          } > "$f"
          cp "$f" RELEASE_NOTES.md
          cat "$f"
          # public repo (fisha-app): general categories only, never details (owner rule 2026-10-15). Each commit may carry
          # a trailer like "Public: إصلاح أخطاء"; details stay in the private release above.
          git log --no-merges --format='%(trailers:key=Public,valueonly)' $range | sed 's/^ *//; s/ *$//' | grep -v '^$' | awk '!seen[$0]++' | sed 's/^/- /' > PUBLIC_NOTES.md
          [ -s PUBLIC_NOTES.md ] || echo "- إصلاح أخطاء وتحسينات" > PUBLIC_NOTES.md
          cat PUBLIC_NOTES.md

      - name: Publish APK as a release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-build-${{ github.run_number }}
          name: Fisha ${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          prerelease: ${{ github.ref_name != 'main' && github.ref_name != 'master' }}
          make_latest: ${{ github.ref_name == 'main' || github.ref_name == 'master' }}
          target_commitish: ${{ github.sha }}
          files: |
            Fisha-${{ steps.ver.outputs.v }}-${{ github.run_number }}.apk
            CHANGES-${{ steps.ver.outputs.v }}-build-${{ github.run_number }}.md
          body_path: RELEASE_NOTES.md

      # one draft per version on fisha-app: older unpublished drafts of the same version are removed first (a published
      # release is never touched). The tag keeps its run/build number: the app's update center reads that format.
      - name: Remove older drafts of this version on fisha-app
        if: success() && env.APP_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.APP_TOKEN }}
        run: |
          gh api --paginate "repos/ahmadalhelly/fisha-app/releases?per_page=100" \
            --jq '.[] | select(.draft == true and (.tag_name | startswith("app-${{ steps.ver.outputs.v }}-build-"))) | .id' |
          while read -r id; do gh api -X DELETE "repos/ahmadalhelly/fisha-app/releases/$id" && echo "removed draft $id"; done

      # the public repo fisha-app is where the app's update center looks (this repo is private). Published as a draft:
      # the update center sees it only after the owner presses Publish on github.com/ahmadalhelly/fisha-app/releases.
      # Needs the secret FISHA_APP_TOKEN: a token with Contents read/write on ahmadalhelly/fisha-app.
      - name: Publish to fisha-app (update center)
        if: success() && env.APP_TOKEN != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: ahmadalhelly/fisha-app
          draft: true                 # reaches users only after the owner presses Publish on GitHub
          token: ${{ env.APP_TOKEN }}
          tag_name: app-${{ steps.ver.outputs.v }}-build-${{ github.run_number }}
          name: App ${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          make_latest: false
          files: Fisha-${{ steps.ver.outputs.v }}-${{ github.run_number }}.apk
          body_path: PUBLIC_NOTES.md

      - name: Save build log to the ci-logs branch
        if: always()
        continue-on-error: true
        working-directory: .
        run: |
          [ -f build.log ] || echo "no build log" > build.log
          tail -c 60000 build.log > /tmp/build.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/STATUS.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp /tmp/build.log /tmp/STATUS.txt .
          git add -f build.log STATUS.txt
          git commit -m "CI log for run ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs || true

  # After every build: remove the Actions runs, artifacts and caches of earlier builds of this workflow, so the
  # storage quota never fills up. Kept: the newest successful run per branch (the release notes compare against it),
  # runs still in progress, and the caches of this build. Runs before this one only; never the current run.
  cleanup:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CUR: ${{ github.run_id }}
      WF: build-app.yml
    steps:
      - name: Delete earlier runs, artifacts and caches of this workflow
        continue-on-error: true
        run: |
          runs=$(gh run list --workflow "$WF" --limit 200 --json databaseId,status,conclusion,headBranch \
            -q '.[] | "\(.databaseId) \(.status) \(.conclusion) \(.headBranch)"')
          keep=$(echo "$runs" | awk '$3=="success" && !seen[$4]++ {print $1}')
          echo "$runs" | while read -r id status concl branch; do
            [ -n "$id" ] || continue
            [ "$id" -lt "$CUR" ] || continue            # this run and newer ones stay
            [ "$status" = "completed" ] || continue
            for a in $(gh api --paginate "repos/$REPO/actions/runs/$id/artifacts" --jq '.artifacts[].id' 2>/dev/null); do
              gh api -X DELETE "repos/$REPO/actions/artifacts/$a" >/dev/null && echo "artifact $a of run $id removed"
            done
            if echo "$keep" | grep -qx "$id"; then continue; fi
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null && echo "run $id removed"
          done
          # caches: per key family only the newest one is kept (the build of this run has saved its caches already, so
          # it is the newest); the older ones go. A family is the key without its last part (the run number or hash).
          gh cache list --limit 100 --json id,key,createdAt \
            -q 'sort_by(.createdAt) | reverse | group_by(.key | sub("-[^-]*$"; "")) | .[] | .[1:][] | "\(.id) \(.key)"' |
          while read -r cid key; do
            gh cache delete "$cid" >/dev/null 2>&1 && echo "cache $key removed"
          done
