name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: |
          f=pubspec.yaml; [ -f app/pubspec.yaml ] && f=app/pubspec.yaml
          v=$(grep -m1 '^version:' "$f" | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          [ -n "$v" ] || { echo "version not found"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze, test, build
        run: |
          set -o pipefail
          {
            flutter --version
            flutter create --platforms=android --org com.mttlhub --project-name mttl_hub .
            pip install --quiet --break-system-packages pillow || pip install --quiet pillow
            python3 tool/configure_android.py
            flutter pub get
            dart run flutter_launcher_icons
            dart run flutter_native_splash:create
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release --build-name=${{ steps.ver.outputs.v }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ steps.ver.outputs.v }}
            cp build/app/outputs/flutter-apk/app-release.apk ../Fisha-${{ steps.ver.outputs.v }}-${{ github.run_number }}.apk
          } 2>&1 | tee ../build.log

      - name: Upload APK as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fisha-${{ steps.ver.outputs.v }}-build-${{ github.run_number }}
          path: Fisha-${{ steps.ver.outputs.v }}-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK as a release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-build-${{ github.run_number }}
          name: Fisha ${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          prerelease: ${{ github.ref_name != 'main' && github.ref_name != 'master' }}
          make_latest: ${{ github.ref_name == 'main' || github.ref_name == 'master' }}
          files: Fisha-${{ steps.ver.outputs.v }}-${{ github.run_number }}.apk
          body: "Release v${{ steps.ver.outputs.v }} - Commit ${{ github.sha }}"

      - name: Save build log to the ci-logs branch
        if: always()
        continue-on-error: true
        working-directory: .
        run: |
          [ -f build.log ] || echo "no build log" > build.log
          tail -c 60000 build.log > /tmp/build.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/STATUS.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp /tmp/build.log /tmp/STATUS.txt .
          git add -f build.log STATUS.txt
          git commit -m "CI log for run ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs || true
