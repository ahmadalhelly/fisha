name: Build Android APK

on:
  push:
    branches: [main, agy/ui-polish-1]
    paths: ['app/**', '.github/workflows/build-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze, test, build
        run: |
          set -o pipefail
          {
            flutter --version
            flutter create --platforms=android --org com.mttlhub --project-name mttl_hub .
            pip install --quiet --break-system-packages pillow || pip install --quiet pillow
            python3 tool/configure_android.py
            flutter pub get
            dart run flutter_launcher_icons
            dart run flutter_native_splash:create
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release --build-name=1.1.0 --build-number=${{ github.run_number }}
            cp build/app/outputs/flutter-apk/app-release.apk ../Fisha-1.1.0-${{ github.run_number }}.apk
          } 2>&1 | tee ../build.log

      # open the APK on an Android emulator and keep the crash report (if any) in the build log
      - name: Free disk space for the emulator
        if: success()
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules \
                      /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          rm -rf app/build ~/.gradle/caches ~/.pub-cache/hosted || true
          df -h / | tail -1

      - name: Enable KVM
        if: success()
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on emulator
        if: success()
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: .
          script: |
            echo "===== LAUNCH TEST (emulator started) =====" >> build.log
            adb install -r Fisha-1.1.0-${{ github.run_number }}.apk
            adb logcat -c
            adb shell am start -n com.mttlhub.mttl_hub/.MainActivity
            sleep 25
            adb logcat -d > launch.log || true
            (adb shell pidof com.mttlhub.mttl_hub && echo "APP RUNNING after 25s") >> build.log || echo "APP NOT RUNNING after 25s" >> build.log
            grep -A60 -E "FATAL EXCEPTION|Process: com.mttlhub" launch.log | head -150 >> build.log || true
            grep -E "flutter|E/AndroidRuntime" launch.log | tail -40 >> build.log || true

      - name: Read app version
        id: ver
        run: echo "v=$(grep -m1 '^version:' app/pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')" >> "$GITHUB_OUTPUT"

      - name: Publish APK as a release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-build-${{ github.run_number }}
          name: Fisha ${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: true
          files: Fisha-1.1.0-${{ github.run_number }}.apk
          body: "Commit ${{ github.sha }}"

      - name: Save build log to the ci-logs branch
        if: always()
        working-directory: .
        run: |
          [ -f build.log ] || echo "no build log" > build.log
          tail -c 60000 build.log > /tmp/build.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/STATUS.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp /tmp/build.log /tmp/STATUS.txt .
          git add -f build.log STATUS.txt
          git commit -m "CI log for run ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs
