name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.mttlhub --project-name mttl_hub .
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' "$M"
          sed -i 's|android:label="mttl_hub"|android:label="MTTL Hub"|' "$M"
          cat "$M"

      - name: Analyze, test, build
        run: |
          set -o pipefail
          {
            flutter --version
            flutter pub get
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release
          } 2>&1 | tee ../build.log

      - name: Publish APK as a release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MTTL Hub build ${{ github.run_number }}
          make_latest: true
          files: app/build/app/outputs/flutter-apk/app-release.apk
          body: "Commit ${{ github.sha }}"

      - name: Save build log to the ci-logs branch
        if: always()
        working-directory: .
        run: |
          [ -f build.log ] || echo "no build log (failed before build step)" > build.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > STATUS.txt
          cp build.log STATUS.txt /tmp/
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp /tmp/build.log /tmp/STATUS.txt .
          git add -f build.log STATUS.txt
          git commit -m "CI log for run ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs
