name: Build web app (iPhone)

on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build for the web
        run: |
          flutter create --platforms=web --org com.mttlhub --project-name mttl_hub .
          [ -d web_overrides ] && cp -r web_overrides/. web/
          # brand assets (pubspec bundles assets/brand/icon_fg.png) + PWA icons in web/icons
          pip install --quiet --break-system-packages pillow || pip install --quiet pillow
          python3 tool/configure_web.py
          flutter pub get
          flutter build web --release --base-href /${{ github.event.repository.name }}/ \
            --dart-define=APP_VERSION=web-${{ github.run_number }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # needs GitHub Pages switched on (Settings → Pages → Source: GitHub Actions); stays green until then
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
