name: Build web app (iPhone)

on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # served from the public repo ahmadalhelly/fisha-web (GitHub Pages); this repo stays private
      - name: Build for the web
        run: |
          flutter create --platforms=web --org com.mttlhub --project-name mttl_hub .
          [ -d web_overrides ] && cp -r web_overrides/. web/
          # brand assets (pubspec bundles assets/brand/icon_fg.png) + PWA icons in web/icons
          pip install --quiet --break-system-packages pillow || pip install --quiet pillow
          python3 tool/configure_web.py
          flutter pub get
          flutter build web --release --base-href /fisha-web/ \
            --dart-define=APP_VERSION=web-${{ github.run_number }}
          touch build/web/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: fisha-web
          path: app/build/web
          include-hidden-files: true
          if-no-files-found: error

      # optional: a token with write access to fisha-web (secret FISHA_WEB_TOKEN) publishes it automatically
      - name: Publish to fisha-web
        env:
          TOKEN: ${{ secrets.FISHA_WEB_TOKEN }}
        if: env.TOKEN != ''
        run: |
          cd build/web
          git init -q -b main && git add -A
          git -c user.name=fisha-ci -c user.email=ci@fisha.invalid commit -qm "web ${{ github.run_number }} (${{ github.sha }})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/ahmadalhelly/fisha-web.git" main
